<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>廖柏瑋｜個人簡歷</title>
  <meta name="description" content="廖柏瑋｜臺科大資工所碩士生的互動式個人簡歷：學經歷、技能與專案作品。">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%234f46e5'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif'>P</text></svg>">

  <style>
    /* ===================== 主題色彩 ===================== */
    :root {
      --bg: #f7f7fb;
      --surface: #ffffff;
      --surface-2: #eef0f7;
      --text: #1d2033;
      --muted: #5f6478;
      --border: #dfe2ec;
      --accent: #4f46e5;
      --accent-2: #0ea5e9;
      --accent-soft: rgba(79, 70, 229, .1);
      --shadow: 0 10px 30px rgba(20, 24, 60, .08);
      --radius: 16px;
      --nav-h: 64px;
      color-scheme: light;
    }
    :root[data-theme="dark"] {
      --bg: #0f1120;
      --surface: #171a2e;
      --surface-2: #20243d;
      --text: #e8e9f3;
      --muted: #a2a6bf;
      --border: #2c3150;
      --accent: #818cf8;
      --accent-2: #38bdf8;
      --accent-soft: rgba(129, 140, 248, .15);
      --shadow: 0 10px 30px rgba(0, 0, 0, .35);
      color-scheme: dark;
    }

    /* ===================== 基本設定 ===================== */
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: calc(var(--nav-h) + 12px); }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      transition: background .3s, color .3s;
      overflow-x: hidden;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    button { font: inherit; color: inherit; cursor: pointer; }
    img { max-width: 100%; }
    :focus-visible { outline: 3px solid var(--accent-2); outline-offset: 2px; border-radius: 6px; }
    .container { width: min(1080px, 100% - 32px); margin-inline: auto; }

    /* ===================== 閱讀進度條 ===================== */
    #progress {
      position: fixed; inset: 0 auto auto 0; height: 3px; width: 0;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      z-index: 200;
    }

    /* ===================== 導覽列 ===================== */
    header.nav {
      position: sticky; top: 0; z-index: 100; height: var(--nav-h);
      background: color-mix(in srgb, var(--bg) 82%, transparent);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .nav-inner { height: 100%; display: flex; align-items: center; gap: 16px; }
    .nav-links { display: flex; gap: 4px; margin-left: auto; list-style: none; padding: 0; margin-block: 0; }
    .nav-links a {
      display: block; padding: 6px 12px; border-radius: 999px; color: var(--muted); font-size: .95rem;
      transition: background .2s, color .2s;
    }
    .nav-links a:hover { text-decoration: none; color: var(--text); background: var(--surface-2); }
    .nav-links a.active { color: var(--accent); background: var(--accent-soft); font-weight: 600; }
    .icon-btn {
      width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--border);
      background: var(--surface); display: grid; place-items: center; flex-shrink: 0;
      transition: transform .2s, border-color .2s;
    }
    .icon-btn:hover { border-color: var(--accent); transform: translateY(-1px); }
    .icon-btn svg { width: 20px; height: 20px; }
    #menuBtn { display: none; }

    @media (max-width: 760px) {
      #menuBtn { display: grid; }
      #themeBtn { margin-left: auto; }
      .nav-links {
        position: fixed; top: var(--nav-h); left: 0; right: 0; flex-direction: column; gap: 0;
        background: var(--surface); border-bottom: 1px solid var(--border); padding: 8px 16px 16px;
        transform: translateY(-120%); transition: transform .3s; box-shadow: var(--shadow); margin: 0;
      }
      .nav-links.open { transform: none; }
      .nav-links a { padding: 12px; border-radius: 10px; }
    }

    /* ===================== 共用區塊 ===================== */
    section { padding: 88px 0; }
    .section-title { font-size: clamp(1.6rem, 3vw, 2.1rem); margin: 0 0 28px; }
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .chip {
      border: 1px solid var(--border); background: var(--surface); padding: 6px 14px;
      border-radius: 999px; font-size: .9rem; color: var(--muted); transition: all .2s;
    }
    .chip:hover { border-color: var(--accent); color: var(--text); }
    .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
    .tag {
      display: inline-block; font-size: .78rem; padding: 2px 10px; border-radius: 999px;
      background: var(--accent-soft); color: var(--accent); font-weight: 600;
    }
    .btn {
      display: inline-flex; align-items: center; gap: 8px; padding: 11px 22px; border-radius: 12px;
      border: 1px solid transparent; font-weight: 600; transition: transform .2s, box-shadow .2s, background .2s;
    }
    .btn:hover { text-decoration: none; transform: translateY(-2px); }
    .btn svg { width: 18px; height: 18px; flex-shrink: 0; }
    .btn-primary { background: var(--accent); color: #fff; box-shadow: 0 8px 20px var(--accent-soft); }
    .btn-ghost { background: var(--surface); border-color: var(--border); color: var(--text); }
    .btn-ghost:hover { border-color: var(--accent); }

    /* 捲動淡入 */
    .reveal { opacity: 0; transform: translateY(24px); transition: opacity .7s ease, transform .7s ease; }
    .reveal.visible { opacity: 1; transform: none; }

    /* ===================== Hero ===================== */
    #home { padding: 72px 0 96px; position: relative; overflow: hidden; }
    #home::before {
      content: ""; position: absolute; inset: -40% -10% auto auto; width: 620px; height: 620px;
      background: radial-gradient(circle, var(--accent-soft), transparent 65%); pointer-events: none;
    }
    .hero { display: grid; grid-template-columns: 1.4fr 1fr; gap: 48px; align-items: center; }
    .hello { color: var(--accent); font-weight: 700; margin: 0; }
    .hero h1 { font-size: clamp(2.4rem, 6vw, 3.8rem); line-height: 1.15; margin: 8px 0 12px; }
    .nickname { font-size: clamp(1.15rem, 2.5vw, 1.5rem); color: var(--text); font-weight: 700; margin: 0 0 28px; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 12px; }
    .avatar-wrap { display: grid; place-items: center; }
    /* Q 版黃金獵犬（參考圖端正坐姿）：自然呼吸、視差擺頭與四肢蹲跳互動 */
    .dog {
      position: relative; isolation: isolate; width: min(320px, 72vw); padding: 0;
      background: none; border: 0; border-radius: 24px; -webkit-tap-highlight-color: transparent;
      cursor: pointer;
    }
    .dog::before {
      content: ""; position: absolute; inset: 4% 2% 2%; z-index: -1;
      border-radius: 36% 64% 58% 42% / 42% 38% 62% 58%;
      background: linear-gradient(135deg, #f59e0b, var(--accent-2)); opacity: .16;
      animation: morph 10s ease-in-out infinite;
    }
    @keyframes morph {
      50% { border-radius: 58% 42% 34% 66% / 60% 52% 48% 40%; }
    }
    .dog svg { display: block; width: 100%; height: auto; overflow: visible; }
    .dog .line { stroke: #181512; stroke-width: 3.1; stroke-linecap: round; stroke-linejoin: round; }
    .dog .dog-shadow { transform-origin: 100px 214px; }
    .dog .breathe {
      transform-origin: 100px 204px;
      animation: breathe 3.6s cubic-bezier(.45, .05, .55, .95) infinite;
    }
    @keyframes breathe {
      0%, 100% { transform: translateY(0) scale(1, 1); }
      50% { transform: translateY(-1.8px) scale(1.012, .99); }
    }
    .dog .torso-group { transform-origin: 100px 185px; }
    .dog .hind-leg-l { transform-origin: 68px 176px; }
    .dog .hind-leg-r { transform-origin: 132px 176px; }
    .dog .front-leg-l { transform-origin: 81px 146px; }
    .dog .front-leg-r { transform-origin: 119px 146px; }
    .dog .head-sway {
      transform-origin: 100px 80px;
      animation: head-idle 5.2s cubic-bezier(.45, .05, .55, .95) infinite;
    }
    @keyframes head-idle {
      0%, 100% { transform: rotate(-1deg) translateY(0); }
      50% { transform: rotate(1.2deg) translateY(-1.5px); }
    }
    .dog .eyes-open { transform-box: fill-box; transform-origin: center; animation: blink 5.2s infinite; }
    @keyframes blink {
      0%, 44%, 48%, 94%, 100% { transform: scaleY(1); }
      46%, 96% { transform: scaleY(.1); }
    }
    .dog .tail {
      transform-origin: 56px 178px;
      animation: wag 1.6s cubic-bezier(.42, 0, .58, 1) infinite;
    }
    @keyframes wag {
      0%, 100% { transform: rotate(-6deg); }
      50% { transform: rotate(12deg); }
    }
    .dog .ear-l {
      transform-origin: 70px 34px;
      animation: ear-idle-l 3.6s ease-in-out infinite;
    }
    .dog .ear-r {
      transform-origin: 130px 34px;
      animation: ear-idle-r 3.6s ease-in-out infinite;
    }
    @keyframes ear-idle-l { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-1.8deg); } }
    @keyframes ear-idle-r { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(1.8deg); } }
    .dog .ear-vibe {
      opacity: .75;
      transition: opacity .25s ease, transform .25s ease;
      transform-box: fill-box;
      transform-origin: center;
    }
    .dog:hover .ear-vibe { opacity: 1; transform: scale(1.06); }
    .dog .happy-face, .dog .heart { opacity: 0; }
    .dog .face-normal, .dog .happy-face { transition: opacity .18s ease; }
    .dog .cheek { opacity: .75; transition: opacity .25s ease, transform .25s ease; transform-box: fill-box; transform-origin: center; }
    .dog:hover .tail { animation-duration: .8s; }
    .dog:hover .cheek { opacity: .95; transform: scale(1.08); }

    /* 點擊時：端正坐姿下蹲蓄力 → 四肢關節連動蹬地跳起 → 緩衝落地回坐 */
    .dog .whole { transform-origin: 100px 210px; }
    .dog.happy .face-normal { opacity: 0; }
    .dog.happy .happy-face { opacity: 1; }
    .dog.happy .cheek { opacity: 1; transform: scale(1.15); }
    .dog.happy .dog-shadow { animation: shadow-jump 1.3s cubic-bezier(.4, 0, .2, 1) forwards; }
    .dog.happy .whole { animation: whole-jump 1.3s cubic-bezier(.4, 0, .2, 1) forwards; }
    .dog.happy .head-sway { animation: head-jump 1.3s cubic-bezier(.4, 0, .2, 1) forwards; }
    .dog.happy .hind-leg-l { animation: hind-leg-l-jump 1.3s cubic-bezier(.4, 0, .2, 1) forwards; }
    .dog.happy .hind-leg-r { animation: hind-leg-r-jump 1.3s cubic-bezier(.4, 0, .2, 1) forwards; }
    .dog.happy .front-leg-l { animation: front-leg-l-jump 1.3s cubic-bezier(.4, 0, .2, 1) forwards; }
    .dog.happy .front-leg-r { animation: front-leg-r-jump 1.3s cubic-bezier(.4, 0, .2, 1) forwards; }
    .dog.happy .tail { animation: tail-jump 1.3s ease-in-out forwards; }
    .dog.happy .ear-l { animation: ear-l-jump 1.3s cubic-bezier(.4, 0, .2, 1) forwards; }
    .dog.happy .ear-r { animation: ear-r-jump 1.3s cubic-bezier(.4, 0, .2, 1) forwards; }
    .dog.happy .happy-tongue {
      transform-origin: 100px 76px;
      animation: pant-fast .24s ease-in-out infinite;
    }
    .dog.happy .heart { animation: float-up 1.5s cubic-bezier(.22, 1, .36, 1) forwards; }
    .dog.happy .heart-1 { animation-delay: .26s; }
    .dog.happy .heart-2 { animation-delay: .42s; }
    .dog.happy .heart-3 { animation-delay: .56s; }

    @keyframes shadow-jump {
      0%, 100% { transform: scale(1, 1); opacity: .11; }
      22% { transform: scale(1.14, 1.08); opacity: .16; }
      48%, 58% { transform: scale(.65, .72); opacity: .05; }
      78% { transform: scale(1.1, 1.05); opacity: .15; }
      90% { transform: scale(.99, 1); opacity: .11; }
    }
    @keyframes whole-jump {
      0%, 100% { transform: translateY(0) scale(1, 1); }
      22% { transform: translateY(2px) scale(1.06, .89); }
      48% { transform: translateY(-24px) scale(.96, 1.05); }
      58% { transform: translateY(-20px) scale(.98, 1.02); }
      78% { transform: translateY(2px) scale(1.04, .92); }
      90% { transform: translateY(-2px) scale(.99, 1.01); }
    }
    @keyframes head-jump {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      22% { transform: translateY(4px) rotate(-3deg); }
      48% { transform: translateY(-4px) rotate(4deg); }
      58% { transform: translateY(-2px) rotate(-3deg); }
      78% { transform: translateY(3px) rotate(2deg); }
    }
    @keyframes hind-leg-l-jump {
      0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1, 1); }
      22% { transform: translate(-3px, 2px) rotate(-6deg) scale(1.06, .92); }
      48% { transform: translate(2px, 6px) rotate(14deg) scale(.96, 1.06); }
      58% { transform: translate(1px, 4px) rotate(10deg); }
      78% { transform: translate(-2px, 2px) rotate(-4deg) scale(1.04, .94); }
    }
    @keyframes hind-leg-r-jump {
      0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1, 1); }
      22% { transform: translate(3px, 2px) rotate(6deg) scale(1.06, .92); }
      48% { transform: translate(-2px, 6px) rotate(-14deg) scale(.96, 1.06); }
      58% { transform: translate(-1px, 4px) rotate(-10deg); }
      78% { transform: translate(2px, 2px) rotate(4deg) scale(1.04, .94); }
    }
    @keyframes front-leg-l-jump {
      0%, 100% { transform: translate(0, 0) rotate(0deg) scaleY(1); }
      22% { transform: translate(-1px, 2px) rotate(5deg) scaleY(.93); }
      46% { transform: translate(-1px, -5px) rotate(11deg) scaleY(.93); }
      56% { transform: translate(0, -6px) rotate(4deg) scaleY(.91); }
      64% { transform: translate(-1px, -4px) rotate(9deg) scaleY(.95); }
      78% { transform: translate(-1px, 2px) rotate(4deg) scaleY(.94); }
    }
    @keyframes front-leg-r-jump {
      0%, 100% { transform: translate(0, 0) rotate(0deg) scaleY(1); }
      22% { transform: translate(1px, 2px) rotate(-5deg) scaleY(.93); }
      46% { transform: translate(1px, -6px) rotate(-4deg) scaleY(.91); }
      56% { transform: translate(1px, -5px) rotate(-11deg) scaleY(.93); }
      64% { transform: translate(0, -4px) rotate(-7deg) scaleY(.95); }
      78% { transform: translate(1px, 2px) rotate(-4deg) scaleY(.94); }
    }
    @keyframes tail-jump {
      0%, 100% { transform: rotate(-6deg); }
      22% { transform: rotate(-18deg); }
      38% { transform: rotate(22deg); }
      48% { transform: rotate(-14deg); }
      58% { transform: rotate(24deg); }
      68% { transform: rotate(-12deg); }
      78% { transform: rotate(18deg); }
      88% { transform: rotate(-8deg); }
    }
    @keyframes ear-l-jump {
      0%, 100% { transform: rotate(0deg); }
      22% { transform: rotate(-5deg) translateY(1px); }
      42% { transform: rotate(10deg) translateY(-2px); }
      58% { transform: rotate(-15deg) translateY(-4px); }
      78% { transform: rotate(6deg) translateY(2px); }
    }
    @keyframes ear-r-jump {
      0%, 100% { transform: rotate(0deg); }
      22% { transform: rotate(5deg) translateY(1px); }
      42% { transform: rotate(-10deg) translateY(-2px); }
      58% { transform: rotate(15deg) translateY(-4px); }
      78% { transform: rotate(-6deg) translateY(2px); }
    }
    @keyframes pant-fast {
      0%, 100% { transform: translateY(0) scaleY(1); }
      50% { transform: translateY(2px) scaleY(1.12); }
    }
    @keyframes float-up {
      0% { opacity: 0; transform: translateY(4px) scale(.5); }
      25% { opacity: 1; }
      100% { opacity: 0; transform: translateY(-38px) scale(1.15); }
    }
    .meta { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 28px; color: var(--muted); font-size: .92rem; }
    .meta span { display: inline-flex; align-items: center; gap: 6px; }
    .meta svg { width: 16px; height: 16px; color: var(--accent); }

    @media (max-width: 760px) {
      .hero { grid-template-columns: 1fr; text-align: center; }
      .avatar-wrap { order: -1; }
      .dog { width: 210px; }
      .hero-actions, .meta { justify-content: center; }
      section { padding: 64px 0; }
    }

    /* ===================== 關於我 ===================== */
    .about-text { padding: 28px; }
    .about-text p { margin: 0 0 14px; }
    .about-text p:last-child { margin: 0; }
    .interests { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }

    /* ===================== 技能 ===================== */
    .skills-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .skill { padding: 18px 20px; transition: transform .25s, opacity .25s; }
    .skill.hide { display: none; }
    .skill-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
    .skill-head + .bar { margin-top: 10px; }
    .skill-head b { font-size: 1rem; }
    .skill-head small { color: var(--muted); }
    .bar { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
    .bar i {
      display: block; height: 100%; width: 0; border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width 1.1s cubic-bezier(.2, .8, .2, 1);
    }
    .skill-note { color: var(--muted); font-size: .85rem; margin: 6px 0 0; }

    /* ===================== 經歷時間軸 ===================== */
    .timeline { position: relative; padding-left: 28px; list-style: none; margin: 0; }
    .timeline::before { content: ""; position: absolute; left: 8px; top: 6px; bottom: 6px; width: 2px; background: var(--border); }
    .tl-item { position: relative; margin-bottom: 18px; }
    .tl-item::before {
      content: ""; position: absolute; left: -27px; top: 22px; width: 16px; height: 16px; border-radius: 50%;
      background: var(--surface); border: 3px solid var(--accent);
    }
    .tl-btn {
      width: 100%; text-align: left; background: none; border: 0; padding: 18px 22px;
      display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; align-items: center;
    }
    .tl-btn h3 { margin: 0; font-size: 1.08rem; }
    .tl-btn .org { color: var(--muted); font-size: .93rem; }
    .tl-btn .when { color: var(--accent); font-weight: 600; font-size: .88rem; white-space: nowrap; }
    .tl-btn .chev { grid-row: span 2; transition: transform .3s; color: var(--muted); }
    .tl-btn[aria-expanded="true"] .chev { transform: rotate(180deg); }
    .tl-detail { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .35s ease; }
    .tl-detail > div { overflow: hidden; }
    .tl-btn[aria-expanded="true"] + .tl-detail { grid-template-rows: 1fr; }
    .tl-detail ul { margin: 0; padding: 0 22px 18px 42px; color: var(--muted); }
    .tl-detail li { margin-bottom: 4px; }
    .tl-head { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .tl-head .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

    /* ===================== 專案作品 ===================== */
    .projects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
    .project {
      padding: 0; text-align: left; overflow: hidden; display: flex; flex-direction: column;
      transition: transform .25s, box-shadow .25s, border-color .25s;
    }
    .project:hover { transform: translateY(-6px); border-color: var(--accent); }
    .project-cover {
      height: 120px; display: grid; place-items: center; font-size: 3rem;
      background: linear-gradient(135deg, var(--accent-soft), color-mix(in srgb, var(--accent-2) 18%, transparent));
    }
    .project-body { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .project-body h3 { margin: 0; font-size: 1.1rem; }
    .project-body p { margin: 0; color: var(--muted); font-size: .93rem; flex: 1; }
    .project-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .project-more { color: var(--accent); font-weight: 600; font-size: .9rem; }

    dialog {
      width: min(640px, 100% - 32px); border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--surface); color: var(--text); padding: 0; box-shadow: var(--shadow);
    }
    dialog::backdrop { background: rgba(10, 12, 30, .55); backdrop-filter: blur(3px); }
    dialog[open] { animation: pop .25s ease; }
    @keyframes pop { from { opacity: 0; transform: translateY(16px) scale(.98); } }
    .modal-cover { height: 140px; font-size: 4rem; }
    .modal-body { padding: 24px 28px 28px; }
    .modal-body h3 { margin: 0 0 4px; font-size: 1.4rem; }
    .modal-body .year { color: var(--muted); font-size: .9rem; }
    .modal-body ul { padding-left: 20px; color: var(--muted); }
    .modal-close { position: absolute; top: 12px; right: 12px; }
    .modal-links { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }

    /* ===================== 聯絡 ===================== */
    .contact-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
    .contact-item {
      min-width: 0; box-shadow: var(--shadow);
      display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 12px;
      border: 1px solid var(--border); background: var(--surface); color: var(--text);

          details: ["以視窗為單位做 SCALE → DELTA → zlib 三階段壓縮，存成單一 BYTEA 欄位", "從原始表與壓縮表分別讀取資料，訓練 1D CNN 進行六類活動辨識並比較準確率", "以 SQL 視圖依活動類別彙整壓縮率"],

        {

        {

          details: ["以 Room 資料庫儲存事項，DAO 回傳 Flow，資料變動時畫面自動更新", "兩個分頁共用同一個 ViewModel，新增或刪除後首頁的未完成計數同步更新", "透過 DatePicker 篩選指定日期的事項"],

        {

          tags: ["VHDL", "FPGA"],
          details: ["以序向邏輯產生骰子點數，可選擇骰子重擲並自動計分", "七段顯示器分時多工顯示點數與比分，骰出快艇時 LED 閃爍", "使用 Quartus II 開發，目標晶片為 Cyclone V"],

        {

          summary: "8051 微處理機課程實驗，以組合語言與 C 控制各種硬體介面。",
          tags: ["C", "組合語言", "8051"],
          details: ["組合語言實作查表運算、泡沫排序與分支控制", "以 Keil C51 控制 LED、七段顯示器與 4×4 矩陣鍵盤", "使用外部中斷切換 LED 花樣與播放速度"],

        },
        {
          title: "魔術方塊教學網站", emoji: "🧩", year: "2022",
          summary: "給所有年齡層的魔術方塊教學網站，從公式到情況判讀一步步學會。",
          tags: ["HTML/CSS", "Bootstrap"],
          details: ["四大頁面：登入頁、教學內容與示範、學習測驗、學習成果總覽", "以圖片示範引導使用者理解公式", "運用 Bootstrap 元件優化版面與互動"]
        },
        {
          title: "終極密碼 App", emoji: "🔢", year: "2022",
          summary: "用 MIT App Inventor 重現小時候常玩的猜數字遊戲。",
          tags: ["App Inventor", "Android"],
          details: ["系統隨機產生數字，玩家依提示縮小範圍直到猜中", "包含登入、遊戲規則與成績報告頁面", "支援與電腦對戰模式"]
        }
      ],

      contacts: [                           // 不需要的項目直接刪除；電話可加 { type: "phone", label: "電話", value: "..." }
        { type: "email",  label: "Email",  value: "john92803@gmail.com" },
        { type: "github", label: "GitHub", value: "github.com/john92803", url: "https://github.com/john92803" }
      ]
    };

    /* =====================================================================
     *  以下是網頁邏輯，一般不需要修改
     * ===================================================================== */
    const $ = (sel, root = document) => root.querySelector(sel);
    const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    const ICONS = {
      email: '<path d="M4 6h16v12H4z"/><path d="m4 7 8 6 8-6"/>',
      github: '<path d="M9 19c-4 1.5-4-2-6-2.5m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12 12 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"/>',
      linkedin: '<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 10v7M8 7v.01M12 17v-4a2 2 0 0 1 4 0v4M12 10v7"/>',
      phone: '<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/>',
      link: '<path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/>',
      pin: '<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
      spark: '<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/>',
      sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
      moon: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
      chev: '<path d="m6 9 6 6 6-6"/>'
    };
    const icon = (name) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ICONS.link}</svg>`;

    /* ---------- 主題切換（記住使用者選擇，預設跟隨系統） ---------- */
    function storageGet(key) { try { return localStorage.getItem(key); } catch { return null; } }
    function storageSet(key, val) { try { localStorage.setItem(key, val); } catch { /* 無痕模式等情況忽略 */ } }

    function applyTheme(theme) {
      document.documentElement.dataset.theme = theme;
      $("#themeBtn").innerHTML = icon(theme === "dark" ? "sun" : "moon");
    }
    applyTheme(storageGet("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
    $("#themeBtn").addEventListener("click", () => {
      const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      applyTheme(next);
      storageSet("theme", next);
    });

    /* ---------- Hero ---------- */
    document.title = `${RESUME.name}｜個人簡歷`;
    $("#heroName").textContent = RESUME.name;
    $("#nickname").textContent = RESUME.nickname;
    $("#heroMeta").innerHTML = [
      RESUME.location && `<span>${icon("pin")}${esc(RESUME.location)}</span>`,
      RESUME.status && `<span>${icon("spark")}${esc(RESUME.status)}</span>`
    ].filter(Boolean).join("");

    // 狗狗：眼睛跟著滑鼠轉，點一下開心地笑
    const dog = $("#dog");
    const dogSvg = $("svg", dog);
    const pupils = $$(".pupil", dog);
    const dogHead = $("#dogHead", dog);
    const dogMuzzle = $("#dogMuzzle", dog);
    const dogBody = $("#dogBody", dog);
    const earTrackL = $("#earTrackL", dog);
    const earTrackR = $("#earTrackR", dog);
    // 透過線性插值（Lerp）與多層視差讓眼神、口鼻、歪頭與垂耳自然連動
    const pointerTarget = { x: 0, y: 0, active: false };
    const pointerCurrent = { x: 0, y: 0 };
    let animFrame = 0;

    function updateDogTarget(clientX, clientY) {
      const r = dogSvg.getBoundingClientRect();
      if (!r.width) return;
      const cx = r.left + r.width * 0.5;
      const cy = r.top + r.height * 0.42;
      const maxDist = Math.max(window.innerWidth, window.innerHeight) * 0.45;
      pointerTarget.x = Math.max(-1, Math.min(1, (clientX - cx) / maxDist));
      pointerTarget.y = Math.max(-1, Math.min(1, (clientY - cy) / maxDist));
      pointerTarget.active = true;
      if (!animFrame) animFrame = requestAnimationFrame(tickDogMotion);
    }

    function tickDogMotion() {
      const ease = pointerTarget.active ? 0.14 : 0.08;
      pointerCurrent.x += (pointerTarget.x - pointerCurrent.x) * ease;
      pointerCurrent.y += (pointerTarget.y - pointerCurrent.y) * ease;

      const nx = pointerCurrent.x;
      const ny = pointerCurrent.y;

      if (dogMuzzle) {
        dogMuzzle.style.transform = "translate(" + (nx * 2.2).toFixed(2) + "px, " + (ny * 1.5).toFixed(2) + "px)";
      }
      if (dogHead) {
        dogHead.style.transformOrigin = "100px 80px";
        dogHead.style.transform = "translate(" + (nx * 2.8).toFixed(2) + "px, " + (ny * 1.8).toFixed(2) + "px) rotate(" + (nx * 4.2).toFixed(2) + "deg)";
      }
      if (earTrackL && earTrackR) {
        earTrackL.style.transformOrigin = "70px 34px";
        earTrackR.style.transformOrigin = "130px 34px";
        earTrackL.style.transform = "rotate(" + (-nx * 2.8 - ny * 1.4).toFixed(2) + "deg) translateY(" + (ny * 1.0).toFixed(2) + "px)";
        earTrackR.style.transform = "rotate(" + (-nx * 2.8 + ny * 1.4).toFixed(2) + "deg) translateY(" + (ny * 1.0).toFixed(2) + "px)";
      }
      if (dogBody) {
        dogBody.style.transformOrigin = "100px 200px";
        dogBody.style.transform = "translate(" + (nx * 1.0).toFixed(2) + "px, " + (ny * 0.5).toFixed(2) + "px)";
      }
      if (Math.hypot(pointerTarget.x - pointerCurrent.x, pointerTarget.y - pointerCurrent.y) > 0.002) {
        animFrame = requestAnimationFrame(tickDogMotion);
      } else {
        animFrame = 0;
      }
      const dx = nx, dy = ny, dist = 1, move = 2.8;
      pupils.forEach((p) => {
        p.style.transform = `translate(${(dx / dist) * move}px, ${(dy / dist) * move}px)`;
      });
    }
    document.addEventListener("pointermove", (e) => {
      updateDogTarget(e.clientX, e.clientY);
    }, { passive: true });
    document.addEventListener("pointerout", (e) => {  // 滑鼠離開視窗時平滑回正
      if (!e.relatedTarget) {
        pointerTarget.x = 0;
        pointerTarget.y = 0;
        pointerTarget.active = false;
        if (!animFrame) animFrame = requestAnimationFrame(tickDogMotion);
      }
    });
    dog.addEventListener("click", () => {
      dog.classList.remove("happy");
      void dog.offsetWidth;                               // 重新觸發動畫
      dog.classList.add("happy");
      clearTimeout(dog.timer);
      dog.timer = setTimeout(() => dog.classList.remove("happy"), 1600);
    });

    /* ---------- 關於我 ---------- */
    $("#aboutText").innerHTML = RESUME.about.map((p) => `<p>${esc(p)}</p>`).join("");
    $("#interests").innerHTML = RESUME.interests.map((t) => `<span class="tag">${esc(t)}</span>`).join("");

    /* ---------- 共用：篩選按鈕 ---------- */
    function buildFilters(container, labels, onChange) {
      const all = ["全部", ...labels];
      container.innerHTML = all.map((l, i) =>
        `<button class="chip" type="button" aria-pressed="${i === 0}" data-value="${esc(l)}">${esc(l)}</button>`
      ).join("");
      container.addEventListener("click", (e) => {
        const btn = e.target.closest(".chip");
        if (!btn) return;
        $$(".chip", container).forEach((c) => c.setAttribute("aria-pressed", c === btn));
        onChange(btn.dataset.value === "全部" ? null : btn.dataset.value);
      });
    }
    const unique = (arr) => [...new Set(arr)];

    /* ---------- 技能 ---------- */
    const skillsGrid = $("#skillsGrid");
    skillsGrid.innerHTML = RESUME.skills.map((s) => `
      <div class="card skill reveal" data-cat="${esc(s.category)}">
        <div class="skill-head"><b>${esc(s.name)}</b><small>${esc(s.category)}</small></div>
        ${s.level != null ? `<div class="bar" role="progressbar" aria-label="${esc(s.name)} 熟練度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${+s.level}"><i data-level="${+s.level}"></i></div>` : ""}
        ${s.note ? `<p class="skill-note">${esc(s.note)}</p>` : ""}
      </div>`).join("");
    buildFilters($("#skillFilters"), unique(RESUME.skills.map((s) => s.category)), (cat) => {
      $$(".skill", skillsGrid).forEach((el) => el.classList.toggle("hide", !!cat && el.dataset.cat !== cat));
    });

    /* ---------- 學經歷時間軸 ---------- */
    const timeline = $("#timeline");
    // 沒有 details 的項目只顯示標題列、不可展開；open: true 的項目預設展開
    timeline.innerHTML = RESUME.timeline.map((t, i) => {
      const hasDetails = !!t.details?.length;
      const head = `
            <span class="tl-head">
              <span class="row"><h3>${esc(t.title)}</h3><span class="tag">${esc(t.type)}</span></span>
              <span class="org">${esc(t.org)}</span>
            </span>
            <span class="when">${esc(t.when)}</span>`;
      return `
      <li class="tl-item reveal" data-type="${esc(t.type)}">
        <div class="card">${hasDetails ? `
          <button class="tl-btn" type="button" aria-expanded="${!!t.open}" aria-controls="tl-${i}">${head}
          </button>
          <div class="tl-detail" id="tl-${i}"><div><ul>${t.details.map((d) => `<li>${esc(d)}</li>`).join("")}</ul></div></div>` : `
          <div class="tl-btn">${head}
          </div>`}
        </div>
      </li>`;
    }).join("");
    timeline.addEventListener("click", (e) => {
      const btn = e.target.closest(".tl-btn");
      if (btn) btn.setAttribute("aria-expanded", btn.getAttribute("aria-expanded") !== "true");
    });

    /* ---------- 專案作品 ---------- */
    const projectsGrid = $("#projectsGrid");
    projectsGrid.innerHTML = RESUME.projects.map((p, i) => `
      <button class="card project reveal" type="button" data-index="${i}" aria-haspopup="dialog">
        <div class="project-cover" aria-hidden="true">${esc(p.emoji || "💡")}</div>
        <div class="project-body">
          <h3>${esc(p.title)}</h3>
          <p>${esc(p.summary)}</p>
          <div class="project-tags">${p.tags.map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</div>
          <span class="project-more">查看詳情 →</span>
        </div>
      </button>`).join("");

    const modal = $("#projectModal");
    projectsGrid.addEventListener("click", (e) => {
      const card = e.target.closest(".project");
      if (!card) return;
      const p = RESUME.projects[card.dataset.index];
      $("#modalCover").textContent = p.emoji || "💡";
      const links = [
        p.link && `<a class="btn btn-primary" href="${esc(p.link)}" target="_blank" rel="noopener">開啟作品 ↗</a>`,
        p.repo && `<a class="btn btn-ghost" href="${esc(p.repo)}" target="_blank" rel="noopener">${icon("github")} 原始碼</a>`
      ].filter(Boolean).join("");
      $("#modalBody").innerHTML = `
        <h3 id="modalTitle">${esc(p.title)}</h3>
        ${p.year ? `<span class="year">${esc(p.year)}</span>` : ""}
        <p>${esc(p.summary)}</p>
        <ul>${(p.details || []).map((d) => `<li>${esc(d)}</li>`).join("")}</ul>
        <div class="project-tags">${p.tags.map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</div>
        ${links ? `<div class="modal-links">${links}</div>` : ""}`;
      modal.showModal();
    });
    $("#modalClose").addEventListener("click", () => modal.close());
    modal.addEventListener("click", (e) => { if (e.target === modal) modal.close(); }); // 點背景關閉

    /* ---------- 聯絡 ---------- */
    $("#contactList").innerHTML = RESUME.contacts.map((c) => {
      if (c.type === "email") {
        return `
        <button class="contact-item" type="button" data-copy="${esc(c.value)}" title="點擊複製 Email">
          ${icon(c.type)}
          <div><small aria-live="polite">${esc(c.label)}・點擊複製</small><span>${esc(c.value)}</span></div>
        </button>`;
      }
      const href = c.type === "phone" ? `tel:${c.value}` : c.url;
      const external = c.type !== "phone";
      return `
        <a class="contact-item" href="${esc(href)}" ${external ? 'target="_blank" rel="noopener"' : ""}>
          ${icon(c.type)}
          <div><small>${esc(c.label)}</small><span>${esc(c.value)}</span></div>
        </a>`;
    }).join("");

    // 點擊 Email 卡片即複製，並在卡片上顯示提示
    $("#contactList").addEventListener("click", async (e) => {
      const btn = e.target.closest("[data-copy]");
      if (!btn) return;
      const text = btn.dataset.copy;
      try { await navigator.clipboard.writeText(text); }
      catch {
        const ta = Object.assign(document.createElement("textarea"), { value: text });
        document.body.append(ta); ta.select(); document.execCommand("copy"); ta.remove();
      }
      const label = $("small", btn);
      label.dataset.text ??= label.textContent;
      label.textContent = "✓ 已複製到剪貼簿";
      btn.classList.add("copied");
      clearTimeout(btn.timer);
      btn.timer = setTimeout(() => { label.textContent = label.dataset.text; btn.classList.remove("copied"); }, 2000);
    });

    $("#footer").textContent = "歡迎交流~";

    /* ---------- 導覽列：手機選單 ---------- */
    const navLinks = $("#navLinks"), menuBtn = $("#menuBtn");
    const setMenu = (open) => { navLinks.classList.toggle("open", open); menuBtn.setAttribute("aria-expanded", open); };
    menuBtn.addEventListener("click", () => setMenu(!navLinks.classList.contains("open")));
    navLinks.addEventListener("click", (e) => { if (e.target.closest("a")) setMenu(false); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") setMenu(false); });

    /* ---------- 捲動相關：淡入、技能條、目前區塊高亮 ---------- */
    const revealObserver = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (!entry.isIntersecting) return;
        const el = entry.target;
        el.classList.add("visible");
        $$(".bar i", el).forEach((bar) => { bar.style.width = bar.dataset.level + "%"; });
        revealObserver.unobserve(el);
      });
    }, { threshold: 0.12 });
    $$(".reveal").forEach((el) => revealObserver.observe(el));

    const sectionLinks = new Map($$(".nav-links a").map((a) => [a.getAttribute("href").slice(1), a]));
    const spyObserver = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (!entry.isIntersecting) return;
        sectionLinks.forEach((a, id) => a.classList.toggle("active", id === entry.target.id));
      });
    }, { rootMargin: "-45% 0px -50% 0px" });
    $$("main section").forEach((s) => spyObserver.observe(s));

    const progress = $("#progress"), toTop = $("#toTop");
    function onScroll() {
      const max = document.documentElement.scrollHeight - innerHeight;
      progress.style.width = (max > 0 ? (scrollY / max) * 100 : 0) + "%";
      toTop.classList.toggle("show", scrollY > 500);
    }
    addEventListener("scroll", onScroll, { passive: true });
    onScroll();
    toTop.addEventListener("click", () => scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" }));

    // 列印前展開所有內容、填滿技能條
    addEventListener("beforeprint", () => {
      $$(".reveal").forEach((el) => el.classList.add("visible"));
      $$(".bar i").forEach((bar) => { bar.style.width = bar.dataset.level + "%"; });
    });
  </script>
</body>
